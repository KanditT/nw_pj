name: quality-inspect

services:
  api:
    build: ./backend
    networks:
      - frappe_docker_frappe_network
    ports:
      - "8000:8000"
    env_file:
      - .env

  app:
    build:
      context: ./frontend
      args: 
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "3000:3000"
    networks:
      - frappe_docker_frappe_network

networks:
  frappe_docker_frappe_network:
    external: true   # 🔥 สำคัญมาก